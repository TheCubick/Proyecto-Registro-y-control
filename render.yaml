databases:
  - name: curso-laravel-db
    plan: free
    databaseName: curso_laravel
    user: curso_laravel

services:
  - type: web
    name: curso-laravel
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: php artisan migrate --force
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: curso-laravel-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: LOG_CHANNEL
        value: stderr
